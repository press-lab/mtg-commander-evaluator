services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mtg_evaluator
      POSTGRES_USER: mtg_user
      POSTGRES_PASSWORD: mtg_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg_user -d mtg_evaluator"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
